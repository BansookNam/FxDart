<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .node{fill:#fff;stroke:var(--fp-ink,#26283B);stroke-width:2}
    .note{font-size:11.5px;opacity:.72}
    .err{fill:var(--fp-err,#E5484D)}
  </style>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
  </defs>

  <!-- dependent -->
  <rect class="panel" x="8" y="8" width="544" height="98" rx="10"/>
  <text x="22" y="28" class="lbl">dependent — flatMap</text>
  <rect class="node" x="26" y="46" width="90" height="34" rx="8"/>
  <text x="71" y="68" text-anchor="middle" class="code">step 1</text>
  <path d="M122 63 H176" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a6)"/>
  <circle class="value" cx="150" cy="46" r="7"/>
  <text x="150" y="88" text-anchor="middle" class="note">needs this value</text>
  <rect class="node" x="184" y="46" width="90" height="34" rx="8"/>
  <text x="229" y="68" text-anchor="middle" class="code">step 2</text>
  <g>
    <rect class="err" x="300" y="52" width="20" height="20" rx="4"/>
    <path d="M305 57 l10 10 M315 57 l-10 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="330" y="60" class="note">step 1 fails →</text>
    <text x="330" y="76" class="note">step 2 never runs, its errors are unknowable</text>
  </g>

  <!-- independent -->
  <rect class="panel" x="8" y="118" width="544" height="112" rx="10"/>
  <text x="22" y="138" class="lbl">independent — map2 / accumulate</text>
  <rect class="node" x="26" y="152" width="90" height="30" rx="8"/>
  <text x="71" y="172" text-anchor="middle" class="code">step A</text>
  <rect class="node" x="26" y="190" width="90" height="30" rx="8"/>
  <text x="71" y="210" text-anchor="middle" class="code">step B</text>
  <path d="M122 167 C 160 167, 160 186, 196 186" fill="none"
    stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M122 205 C 160 205, 160 186, 196 186" fill="none"
    stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a6)"/>
  <rect class="node" x="204" y="170" width="100" height="32" rx="8"/>
  <text x="254" y="191" text-anchor="middle" class="code">combine</text>
  <g>
    <rect class="err" x="330" y="158" width="18" height="18" rx="4"/>
    <path d="M334.5 162.5 l9 9 M343.5 162.5 l-9 9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect class="err" x="330" y="196" width="18" height="18" rx="4"/>
    <path d="M334.5 200.5 l9 9 M343.5 200.5 l-9 9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="358" y="172" class="note">both branches ran, so</text>
    <text x="358" y="188" class="note">both failures are available —</text>
    <text x="358" y="204" class="note">and both could have run at once</text>
  </g>
</svg>
