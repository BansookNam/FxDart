<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    .op{fill:var(--fp-op,#6C5CE7)}
    text{fill:var(--fp-ink,#26283B);font-size:13px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .note{font-size:11.5px;opacity:.72}
    .eq{font-size:22px;font-weight:700}
    .bad{fill:var(--fp-err,#E5484D)}
  </style>

  <!-- pure -->
  <rect class="panel" x="8" y="8" width="544" height="86" rx="10"/>
  <text x="22" y="28" class="lbl">pure — substitution allowed</text>
  <text x="30" y="56" class="code">double_(21) + double_(21)</text>
  <text x="248" y="60" class="eq">=</text>
  <text x="286" y="56" class="code">42 + 42</text>
  <text x="544" y="56" text-anchor="end" class="note">both programs are the same program</text>
  <text x="30" y="80" class="note">nothing outside the arrow can tell which one ran</text>

  <!-- impure -->
  <rect class="panel" x="8" y="106" width="544" height="96" rx="10"/>
  <text x="22" y="126" class="lbl">impure — substitution breaks</text>
  <text x="30" y="154" class="code">doubleAndLog(21) + doubleAndLog(21)</text>
  <text x="300" y="158" class="eq" fill="var(--fp-err,#E5484D)">≠</text>
  <text x="330" y="154" class="code">42 + 42</text>
  <g>
    <rect x="30" y="168" width="150" height="22" rx="5" fill="none"
      stroke="var(--fp-err,#E5484D)" stroke-width="1.6"/>
    <text x="105" y="183" text-anchor="middle" class="note">log: 2 entries</text>
    <rect x="330" y="168" width="150" height="22" rx="5" fill="none"
      stroke="var(--fp-lazy,#9CA3AF)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="405" y="183" text-anchor="middle" class="note">log: 0 entries</text>
    <text x="196" y="183" class="note">vs</text>
  </g>
</svg>
