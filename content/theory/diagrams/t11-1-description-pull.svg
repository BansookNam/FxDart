<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .plan{fill:none;stroke:var(--fp-lazy,#9CA3AF);stroke-width:2;stroke-dasharray:6 4}
    .live{fill:#fff;stroke:var(--fp-op,#6C5CE7);stroke-width:2}
    .note{font-size:11.5px;opacity:.72}
  </style>
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
    <marker id="a11g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-lazy,#9CA3AF)"/>
    </marker>
  </defs>

  <!-- the plan -->
  <rect class="panel" x="8" y="8" width="544" height="80" rx="10"/>
  <text x="22" y="28" class="lbl">built — a description, nothing running</text>
  <path class="plan" d="M28 58 H108" marker-end="url(#a11g)"/>
  <rect class="plan" x="116" y="42" width="76" height="32" rx="8"/>
  <text x="154" y="63" text-anchor="middle" class="code">map</text>
  <path class="plan" d="M198 58 H244" marker-end="url(#a11g)"/>
  <rect class="plan" x="252" y="42" width="76" height="32" rx="8"/>
  <text x="290" y="63" text-anchor="middle" class="code">filter</text>
  <path class="plan" d="M334 58 H380" marker-end="url(#a11g)"/>
  <rect class="plan" x="388" y="42" width="76" height="32" rx="8"/>
  <text x="426" y="63" text-anchor="middle" class="code">take 3</text>
  <text x="544" y="62" text-anchor="end" class="note">0 calls</text>

  <!-- the pull -->
  <rect class="panel" x="8" y="100" width="544" height="102" rx="10"/>
  <text x="22" y="120" class="lbl">consumed — the terminal pulls, one value at a time</text>
  <circle class="value" cx="36" cy="152" r="10"/>
  <path d="M50 152 H108" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a11)"/>
  <rect class="live" x="116" y="136" width="76" height="32" rx="8"/>
  <text x="154" y="157" text-anchor="middle" class="code">map</text>
  <path d="M198 152 H244" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a11)"/>
  <rect class="live" x="252" y="136" width="76" height="32" rx="8"/>
  <text x="290" y="157" text-anchor="middle" class="code">filter</text>
  <path d="M334 152 H380" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a11)"/>
  <rect class="live" x="388" y="136" width="76" height="32" rx="8"/>
  <text x="426" y="157" text-anchor="middle" class="code">take 3</text>
  <path d="M470 152 H506" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a11)"/>
  <circle class="value" cx="522" cy="152" r="10"/>
  <path d="M522 176 C 420 196, 140 196, 40 176" fill="none"
    stroke="var(--fp-op,#6C5CE7)" stroke-width="1.8" stroke-dasharray="3 3"
    marker-end="url(#a11)"/>
  <text x="280" y="196" text-anchor="middle" class="note">the pull travels backwards; the values come forwards</text>
</svg>
