<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 235" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .scope{fill:var(--fp-bg,#F0F1F6);stroke:var(--fp-op,#6C5CE7);stroke-width:2}
    .note{font-size:11.5px;opacity:.72}
    .ok{fill:var(--fp-ok,#2F9E68)}
    .err{fill:var(--fp-err,#E5484D)}
    .exit{stroke:var(--fp-err,#E5484D);stroke-width:2;fill:none;stroke-dasharray:5 4}
    .flow{stroke:var(--fp-op,#6C5CE7);stroke-width:2;fill:none}
  </style>
  <defs>
    <marker id="a15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
    <marker id="a15e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-err,#E5484D)"/>
    </marker>
  </defs>

  <rect class="scope" x="30" y="26" width="330" height="176" rx="12"/>
  <text x="44" y="46" class="lbl">either((r) { … })</text>

  <!-- straight-line steps -->
  <g>
    <rect x="56" y="60" width="200" height="26" rx="6" fill="#fff" stroke="var(--fp-ink,#26283B)" stroke-width="1.6"/>
    <text x="66" y="78" class="code">final a = r.bind(step1);</text>
    <circle class="ok" cx="278" cy="73" r="8"/>
    <path d="M274 73 l3 4 l6 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <path class="flow" d="M156 90 V102" marker-end="url(#a15)"/>
  <g>
    <rect x="56" y="106" width="200" height="26" rx="6" fill="#fff" stroke="var(--fp-ink,#26283B)" stroke-width="1.6"/>
    <text x="66" y="124" class="code">final b = r.bind(step2);</text>
    <rect class="err" x="270" y="111" width="16" height="16" rx="3"/>
    <path d="M274 115 l8 8 M282 115 l-8 8" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  </g>
  <path class="flow" d="M156 136 V148" stroke-dasharray="4 4" marker-end="url(#a15)" opacity=".4"/>
  <g opacity=".4">
    <rect x="56" y="152" width="200" height="26" rx="6" fill="#fff" stroke="var(--fp-lazy,#9CA3AF)" stroke-width="1.6"/>
    <text x="66" y="170" class="code">return combine(a, b);</text>
  </g>
  <text x="56" y="194" class="note">never reached</text>

  <!-- the exit -->
  <path class="exit" d="M292 119 C 340 119, 340 119, 392 119" marker-end="url(#a15e)"/>
  <text x="404" y="106" class="note">the exit lands</text>
  <text x="404" y="122" class="note">at the boundary —</text>
  <text x="404" y="138" class="note">never further</text>

  <!-- results -->
  <g>
    <rect x="392" y="40" width="150" height="30" rx="7" fill="#fff" stroke="var(--fp-ok,#2F9E68)" stroke-width="2"/>
    <text x="402" y="60" class="code">Right(value)</text>
    <rect x="392" y="160" width="150" height="30" rx="7" fill="#fff" stroke="var(--fp-err,#E5484D)" stroke-width="2"/>
    <text x="402" y="180" class="code">Left(error)</text>
  </g>
  <path class="flow" d="M366 60 H386" marker-end="url(#a15)"/>
  <path class="exit" d="M392 138 C 400 150, 400 158, 420 158" marker-end="url(#a15e)"/>
  <text x="30" y="222" class="note">one scope, one boundary: a control-flow jump becomes an ordinary value</text>
</svg>
