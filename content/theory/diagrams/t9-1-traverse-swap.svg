<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .outer{fill:none;stroke:var(--fp-ink,#26283B);stroke-width:2.4}
    .inner{fill:#fff;stroke:var(--fp-ok,#2F9E68);stroke-width:1.8}
    .note{font-size:11.5px;opacity:.72}
  </style>
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
  </defs>

  <text x="14" y="22" class="lbl">before — a list of effects</text>
  <text x="330" y="22" class="lbl">after — one effect, one list</text>

  <!-- before: List<Either<E, A>> -->
  <rect class="outer" x="14" y="34" width="230" height="104" rx="10"/>
  <text x="24" y="52" class="code">List</text>
  <g>
    <rect class="inner" x="30" y="60" width="60" height="60" rx="8"/>
    <text x="60" y="78" text-anchor="middle" class="note">Right</text>
    <circle class="value" cx="60" cy="98" r="11"/>
  </g>
  <g>
    <rect class="inner" x="98" y="60" width="60" height="60" rx="8"/>
    <text x="128" y="78" text-anchor="middle" class="note">Right</text>
    <circle class="value" cx="128" cy="98" r="11"/>
  </g>
  <g>
    <rect class="inner" x="166" y="60" width="60" height="60" rx="8"/>
    <text x="196" y="78" text-anchor="middle" class="note">Right</text>
    <circle class="value" cx="196" cy="98" r="11"/>
  </g>

  <path d="M254 88 H316" stroke="var(--fp-op,#6C5CE7)" stroke-width="2.4" marker-end="url(#a9)"/>
  <text x="285" y="78" text-anchor="middle" class="code">sequence</text>

  <!-- after: Either<E, List<A>> -->
  <rect class="inner" x="326" y="34" width="226" height="104" rx="10" stroke-width="2.4"/>
  <text x="338" y="52" class="note">Right</text>
  <rect class="outer" x="340" y="58" width="196" height="62" rx="8"/>
  <text x="350" y="74" class="code">List</text>
  <circle class="value" cx="382" cy="98" r="11"/>
  <circle class="value" cx="438" cy="98" r="11"/>
  <circle class="value" cx="494" cy="98" r="11"/>

  <rect class="panel" x="14" y="152" width="538" height="46" rx="10"/>
  <text x="28" y="172" class="note">the values never changed — only which structure is on the outside</text>
  <text x="28" y="190" class="note">one Left anywhere on the left becomes the single Left on the right</text>
</svg>
