<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .node{fill:#fff;stroke:var(--fp-ink,#26283B);stroke-width:2}
    .note{font-size:11.5px;opacity:.72}
    .ask{stroke:var(--fp-op,#6C5CE7);stroke-width:2;fill:none}
    .give{stroke:var(--fp-value,#3B82F6);stroke-width:2;fill:none}
    .time{stroke:var(--fp-time,#F59E0B);stroke-width:2;fill:none}
  </style>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-value,#3B82F6)"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-time,#F59E0B)"/>
    </marker>
  </defs>

  <!-- pull -->
  <rect class="panel" x="8" y="8" width="544" height="94" rx="10"/>
  <text x="22" y="28" class="lbl">pull — the consumer starts it</text>
  <rect class="node" x="30" y="44" width="120" height="40" rx="8"/>
  <text x="90" y="69" text-anchor="middle" class="code">producer</text>
  <rect class="node" x="392" y="44" width="130" height="40" rx="8"/>
  <text x="457" y="69" text-anchor="middle" class="code">consumer</text>
  <path class="ask" d="M386 56 H158" marker-end="url(#ap)"/>
  <text x="272" y="50" text-anchor="middle" class="note">next() — "one more, please"</text>
  <path class="give" d="M158 76 H386" marker-end="url(#av)"/>
  <circle class="value" cx="272" cy="76" r="7"/>
  <text x="544" y="98" text-anchor="end" class="note">stop asking = backpressure</text>

  <!-- push -->
  <rect class="panel" x="8" y="114" width="544" height="98" rx="10"/>
  <text x="22" y="134" class="lbl">push — the world starts it</text>
  <rect class="node" x="30" y="150" width="120" height="40" rx="8"/>
  <text x="90" y="175" text-anchor="middle" class="code">producer</text>
  <rect class="node" x="392" y="150" width="130" height="40" rx="8"/>
  <text x="457" y="175" text-anchor="middle" class="code">consumer</text>
  <path class="time" d="M90 146 V130 H60" marker-end="url(#at)"/>
  <text x="150" y="128" class="note">an event happens</text>
  <path class="give" d="M158 170 H386" marker-end="url(#av)"/>
  <circle class="value" cx="230" cy="170" r="7"/>
  <circle class="value" cx="272" cy="170" r="7"/>
  <circle class="value" cx="314" cy="170" r="7"/>
  <text x="272" y="196" text-anchor="middle" class="note">nobody upstream is waiting — buffer or drop</text>
</svg>
