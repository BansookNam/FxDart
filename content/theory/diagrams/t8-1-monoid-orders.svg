<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .marble{fill:#fff;font-size:10.5px;font-weight:700;text-anchor:middle}
    .note{font-size:11.5px;opacity:.72}
    .brace{fill:none;stroke:var(--fp-op,#6C5CE7);stroke-width:1.8}
    .eq{font-size:18px;font-weight:700}
  </style>

  <text x="14" y="22" class="lbl">same four values, four bracketings, one answer</text>

  <!-- row 1: left to right -->
  <g>
    <text x="14" y="52" class="note">sequential</text>
    <circle class="value" cx="110" cy="47" r="12"/><text class="marble" x="110" y="51">1</text>
    <circle class="value" cx="150" cy="47" r="12"/><text class="marble" x="150" y="51">2</text>
    <circle class="value" cx="190" cy="47" r="12"/><text class="marble" x="190" y="51">3</text>
    <circle class="value" cx="230" cy="47" r="12"/><text class="marble" x="230" y="51">4</text>
    <path class="brace" d="M98 63 h24 v6 h18"/>
    <path class="brace" d="M98 69 h60 v6 h20"/>
    <path class="brace" d="M98 75 h100 v6 h20"/>
    <text x="330" y="66" class="code">((1+2)+3)+4</text>
    <text x="470" y="66" class="eq">= 10</text>
  </g>

  <!-- row 2: chunked -->
  <g>
    <text x="14" y="122" class="note">chunked</text>
    <circle class="value" cx="110" cy="117" r="12"/><text class="marble" x="110" y="121">1</text>
    <circle class="value" cx="150" cy="117" r="12"/><text class="marble" x="150" y="121">2</text>
    <circle class="value" cx="190" cy="117" r="12"/><text class="marble" x="190" y="121">3</text>
    <circle class="value" cx="230" cy="117" r="12"/><text class="marble" x="230" y="121">4</text>
    <path class="brace" d="M98 133 h64 v6"/>
    <path class="brace" d="M178 133 h64 v6"/>
    <path class="brace" d="M130 139 h90 v6"/>
    <text x="330" y="136" class="code">(1+2) + (3+4)</text>
    <text x="470" y="136" class="eq">= 10</text>
  </g>

  <!-- row 3: identity -->
  <g>
    <rect class="panel" x="8" y="162" width="544" height="48" rx="10"/>
    <text x="22" y="182" class="lbl">identity — the empty case has an answer</text>
    <text x="22" y="200" class="code">fold(0, +) over []  =  0</text>
    <text x="220" y="200" class="note">total</text>
    <text x="300" y="200" class="code">reduce(+) over []  =  throws</text>
    <text x="510" y="200" class="note">partial</text>
  </g>
</svg>
