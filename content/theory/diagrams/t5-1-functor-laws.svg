<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="system-ui, sans-serif">
  <style>
    .value{fill:var(--fp-value,#3B82F6)}
    text{fill:var(--fp-ink,#26283B);font-size:12.5px}
    .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:var(--fp-op,#6C5CE7)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--fp-op,#6C5CE7)}
    .panel{fill:var(--fp-bg,#F0F1F6)}
    .node{fill:#fff;stroke:var(--fp-ink,#26283B);stroke-width:2}
    .note{font-size:11.5px;opacity:.72}
    .eq{font-size:20px;font-weight:700}
  </style>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fp-op,#6C5CE7)"/>
    </marker>
  </defs>

  <!-- identity -->
  <rect class="panel" x="8" y="8" width="230" height="94" rx="10"/>
  <text x="22" y="28" class="lbl">identity</text>
  <rect class="node" x="40" y="52" width="40" height="30" rx="7"/>
  <circle class="value" cx="60" cy="67" r="9"/>
  <path d="M60 46 a22 16 0 1 1 -0.1 0" fill="none"
    stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
  <text x="104" y="44" class="code">map(id)</text>
  <text x="120" y="72" class="eq">=</text>
  <rect class="node" x="150" y="52" width="40" height="30" rx="7"/>
  <circle class="value" cx="170" cy="67" r="9"/>
  <text x="22" y="96" class="note">the loop is not a step, it is nothing</text>

  <!-- composition square -->
  <rect class="panel" x="250" y="8" width="302" height="94" rx="10"/>
  <text x="264" y="28" class="lbl">composition</text>
  <rect class="node" x="272" y="48" width="38" height="28" rx="7"/>
  <circle class="value" cx="291" cy="62" r="8"/>
  <path d="M316 62 H358" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
  <text x="337" y="54" text-anchor="middle" class="code">map f</text>
  <rect class="node" x="366" y="48" width="38" height="28" rx="7"/>
  <circle class="value" cx="385" cy="62" r="8"/>
  <path d="M410 62 H452" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
  <text x="431" y="54" text-anchor="middle" class="code">map g</text>
  <rect class="node" x="460" y="48" width="38" height="28" rx="7"/>
  <circle class="value" cx="479" cy="62" r="8"/>
  <path d="M291 84 C 340 104, 430 104, 479 84" fill="none"
    stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
  <text x="385" y="100" text-anchor="middle" class="code">map (g ∘ f)</text>

  <!-- consequence -->
  <rect class="panel" x="8" y="118" width="544" height="98" rx="10"/>
  <text x="22" y="138" class="lbl">what the law licenses — one pass, not two</text>
  <g>
    <text x="22" y="162" class="note">staged (eager): a whole list per step</text>
    <rect class="node" x="22" y="170" width="180" height="26" rx="6"/>
    <circle class="value" cx="46" cy="183" r="7"/><circle class="value" cx="70" cy="183" r="7"/>
    <circle class="value" cx="94" cy="183" r="7"/>
    <text x="130" y="187" class="note">then again…</text>
  </g>
  <text x="228" y="187" class="eq">=</text>
  <g>
    <text x="266" y="162" class="note">fused (lazy): one element, whole chain</text>
    <circle class="value" cx="280" cy="183" r="7"/>
    <path d="M292 183 H330" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
    <rect class="node" x="338" y="170" width="46" height="26" rx="6"/>
    <text x="361" y="187" text-anchor="middle" class="code">f</text>
    <path d="M390 183 H426" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
    <rect class="node" x="434" y="170" width="46" height="26" rx="6"/>
    <text x="457" y="187" text-anchor="middle" class="code">g</text>
    <path d="M486 183 H514" stroke="var(--fp-op,#6C5CE7)" stroke-width="2" marker-end="url(#a5)"/>
    <circle class="value" cx="530" cy="183" r="7"/>
  </g>
</svg>
