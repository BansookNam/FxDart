# Guards the things `coverage.yml` structurally cannot.
#
# Two bugs shipped and sat for two releases each because nothing but a manual
# `./deploy.sh` ever exercised them:
#
#   * `fx(xs).join()` stopped compiling in 0.8.0 — redeclaring a member on an
#     extension type replaces the interface member, so `Iterable.join`'s
#     default was lost. Coverage stayed at 100% throughout, because every test
#     passed a separator. `test/api_surface_test.dart` now calls every member
#     in its bare form, so the *test suite* catches it — but the analyzer step
#     below is what catches the same class of break in the merged bundle.
#   * The playground bundle (`docs/assets/fxdart_single.dart`) failed to
#     analyze from 0.8.1, because `tools/build_single_file.sh` keeps a
#     hand-maintained `_$NAME` wrapper list that `uniqStrict`/`uniqByStrict`
#     were never added to. Only a deploy ran it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze library
        run: dart analyze lib

      - name: Analyze tests and tooling
        run: dart analyze test tool benchmark

      # Regenerates the single-file playground build and analyzes it. This is
      # the only check that sees wrapper drift in tools/build_single_file.sh.
      #
      # A "bundle is up to date" step used to follow, comparing the rebuild
      # against the committed copy. docs/ is no longer tracked, so that
      # `git diff` would match nothing and pass unconditionally — a check that
      # had quietly stopped checking. It is deleted rather than left in place;
      # staleness is now impossible, because every publish rebuilds from lib/.
      # The wrapper-drift coverage is in this step's own `dart analyze`.
      - name: Build and analyze the playground bundle
        run: bash tools/build_single_file.sh

      # `tool/check_translation.dart` existed since 0.8.6 but nothing ever
      # called it, so "the translations are structurally in step" was a claim
      # a human had to re-verify by hand. Only `ko` is gated, and that is
      # deliberate: it is the one locale translated end to end (301 of 301
      # pages). `es` is a partial translation carrying 25 real defects of its
      # own, and ja/pt-BR/ru/zh-Hans have no overlay for most pages at all,
      # which the checker reports as `missing` by design — gating any of those
      # would be red on every commit and would therefore report nothing.
      - name: Korean translation is structurally in step with English
        run: dart run tool/check_translation.dart ko

      # The page set is derived twice — build_docs enumerates it from its own
      # family tables, check_translation walks content/. They must agree, or
      # a newly added page family is silently exempt from the gate above.
      - name: The two translatable-page sets agree
        run: |
          diff <(dart run tool/build_docs.dart --list-translatable) \
               <(dart run tool/check_translation.dart --list-translatable)

      # The site is built and published by pages.yml on a push to main, which
      # means a content/ change that does not render is a broken public site
      # discovered *after* the merge. These two steps move that discovery to
      # PR time, which is what lets a contributor ignore the docs build
      # entirely: they do not run it, CI does, and CI tells them if they broke
      # it. build_docs is ~2.5s; check_theory actually executes all 74 book
      # listings and takes ~65s.
      #
      # Precompiling playgrounds is deliberately NOT here: it is ~10 minutes
      # and depends on the DartPad compile service, so it belongs in the
      # publish workflow rather than on every push. A missing artifact costs a
      # reader latency, never correctness.
      - name: The site renders
        run: dart run tool/build_docs.dart

      - name: Theory book listings run, and fit the page
        run: dart run tool/check_theory.dart

      # AUTHORING.md's first rule: a benchmark case must measure the same
      # pipeline its published example shows.
      - name: Benchmark cases match their examples
        run: dart run tool/check_benchmark_faithfulness.dart

      # Deliberately NOT running `run_benchmarks.dart --smoke` here: it
      # AOT-compiles all 94 case binaries (minutes) and, smoke or not, rewrites
      # benchmark/results/*.json — a tracked file the docs render from. The
      # `dart analyze benchmark` step above already catches a case that stops
      # compiling; checksum agreement is verified when a real run is made.
