name: fxdart
description: A functional programming library for Dart, ported from FxTS. Lazy evaluation, concurrent async iteration, and pipeline-style composition.
version: 0.8.5
homepage: https://github.com/bansooknam/fxDart
repository: https://github.com/bansooknam/fxDart
issue_tracker: https://github.com/bansooknam/fxDart/issues

# pub.dev search facets. Max 5 entries, lowercase, 2-32 chars, hyphens allowed.
topics:
  - functional
  - iterable
  - lazy
  - pipeline
  - async

# pub.dev builds the package thumbnail (100x100 in search, 190x190 on the
# package page) from the first entry here.
screenshots:
  - description: 'The fxdart mark: an "Fx" pierced by a dart in flight, fletching to arrowhead — the lazy pipeline, pulled forward one element at a time.'
    path: screenshots/logo.webp

executables:
  fxdart_skills: install_skills

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:

dev_dependencies:
  # Used only by the "native Dart" panels under content/code-comparison/ —
  # the library itself stays zero-dependency.
  collection: ^1.18.0
  # Used only by the "RxDart" panels under content/code-comparison-rx/.
  rxdart: ^0.28.0
  coverage: ^1.11.0
  lints: ^5.0.0
  test: ^1.25.0
